    <script>
      // One-time pre-swap migration (mirrors src/lib/storageMigration.ts):
      // copy legacy theme keys forward so returning users keep their theme
      // on first paint, before the bundle boots.
      try {
        if (
          localStorage.getItem('aniraku:settings') == null &&
          localStorage.getItem('miruro:settings') != null
        ) {
          localStorage.setItem(
            'aniraku:settings',
            localStorage.getItem('miruro:settings'),
          );
        }
        if (
          localStorage.getItem('aniraku:settings:theme') == null &&
          localStorage.getItem('miruro:settings:theme') != null
        ) {
          localStorage.setItem(
            'aniraku:settings:theme',
            localStorage.getItem('miruro:settings:theme'),
          );
        }
      } catch (e2) {}
      var t = "dark";
      try {
        var s = JSON.parse(localStorage.getItem("aniraku:settings") || "null");
        t = (s && s.theme) || JSON.parse(localStorage.getItem("aniraku:settings:theme")) || null;
      } catch (e) {}
      if (!t) {
        /* local legacy fallback: pre-migration installs stored the theme here
           (ThemeContext's read chain mirrors this exact order) */
        try {
          var p = localStorage.getItem("themePreference");
          if (p) t = p === "dark" || p === "light" ? p : (JSON.parse(p) || {}).mode;
        } catch (e) {}
      }
      if (!t) t = "dark";
      var h = document.documentElement;
      if (!["light", "dark", "anilist", "catppuccin"].includes(t))
        t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      h.classList.add(t + "-mode");
      h.style.backgroundColor =
        {
          dark: "#0b0b0f",
          light: "#f5f5f5",
          anilist: "#0b1622",
          catppuccin: "#1e1e2e",
        }[t] || "#0b0b0f";
      /* local-only: themes.css selects palettes via [data-theme] (live selects
         its palettes via the t-mode classes above) — same resolved value */
      h.setAttribute("data-theme", t);
    </script>
